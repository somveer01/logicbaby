<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LogicBaby — Fun Logic Puzzles for Kids</title>
  <meta name="description" content="Age-based visual logic reasoning puzzles for toddlers, preschoolers, and kids. Practice patterns, shapes, odd one out, and math logic with voice narration & cheerful sounds!">
  
  <!-- PWA & Mobile Meta -->
  <meta name="theme-color" content="#6C3FB5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  
  <!-- Fonts: Fredoka (headings) + Nunito (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <!-- Design System -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <!-- Topbar (rendered by topbar.js) -->
    <header id="topbar" class="topbar"></header>

    <!-- Main Content (swapped by router) -->
    <main id="main-content" class="main-content"></main>

    <!-- Floating Mascot -->
    <div id="mascot-widget" class="mascot-widget"></div>

    <!-- Modal Overlay (age selector, celebration, etc.) -->
    <div id="modal-container" class="modal-container hidden"></div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
