<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LogicBaby — Fun Logic Puzzles for Kids</title>
  <meta name="description" content="Age-based visual logic reasoning puzzles for toddlers, preschoolers, and kids. Practice patterns, shapes, odd one out, and math logic with voice narration & cheerful sounds!">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- PWA & Mobile Meta -->
  <meta name="theme-color" content="#6C3FB5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <!-- Fonts: Fredoka (headings) + Nunito (body) with display=swap for zero render delay -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti for celebrations (deferred) -->
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  
  <!-- Design System -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <!-- Topbar (rendered by topbar.js) -->
    <header id="topbar" class="topbar"></header>

    <!-- Main Content (swapped by router) -->
    <main id="main-content" class="main-content"></main>

    <!-- Native Mobile Bottom App Navigation Dock -->
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav"></nav>

    <!-- Floating Mascot -->
    <div id="mascot-widget" class="mascot-widget"></div>

    <!-- Modal Overlay (age selector, celebration, etc.) -->
    <div id="modal-container" class="modal-container hidden"></div>
  </div>

  <!-- Service Worker Registration for Offline & PWA Stores -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function(reg) {
          console.log('🧠 LogicBaby ServiceWorker registered:', reg.scope);
        })
        .catch(function(err) {
          console.warn('ServiceWorker registration error:', err);
        });
    }
  </script>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
